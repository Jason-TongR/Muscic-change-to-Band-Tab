name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/windows-*']
    paths:
      - '.github/workflows/windows-build.yml'
      - 'bandtab/**'
      - 'desktop.py'
      - 'packaging/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'build-windows.cmd'
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      BANDTAB_HOME: ${{ github.workspace }}/data/ci-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            scripts/setup_desktop.py
            requirements*.txt
      - name: Install CPU AI and desktop dependencies
        run: python scripts/setup_desktop.py
      - name: Build, install, transcribe, upgrade and uninstall
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipSetup
      - name: Upload tested Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: BandTabStudio-Windows-x64
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Keep Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BandTabStudio-Windows-diagnostics
          path: |
            data/windows-validation/*.json
            data/windows-validation/*.log
            data/windows-validation/*.png
            data/ci-home/desktop.log
          if-no-files-found: ignore
          retention-days: 7
